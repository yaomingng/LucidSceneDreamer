max_iter: 10001
image_save_iter: 100
logging_iter: 100
snapshot_save_iter: 1000
output_dir: ./outputs/lucidscenedreamer_train
resume: False
prompt: "A futuristic cyberpunk cityscape with towering reflective glass skyscrapers, glowing neon signs in hot pink and electric blue, and a dense fog diffusing light into vibrant halos. The streets are slick with rain, reflecting neon colors, while holographic advertisements float in the air, creating a chaotic yet mesmerizing atmosphere."
pretrained_model: "./scenedreamer_models/scenedreamer_released.pt"
randomised_seed: False
seed: 2

gen_opt:
    param_groups:
        hash_encoder:
            lr: 0.0001
        render_net:
            lr: 0.0001
        sky_net:
            lr: 0.0001
        style_net:
            lr: 0.0001
        denoiser:
            lr: 0.0001

gen:
    type: imaginaire.generators.lucidscenedreamer
    pcg_dataset_path: ./data/terrain_cache
    pcg_cache: True
    scene_size: 2048

    blk_feat_dim: 64

    pe_lvl_feat: 4
    pe_incl_orig_feat: False
    pe_no_pe_feat_dim: 40
    pe_lvl_raydir: 0
    pe_incl_orig_raydir: False
    style_dims: 128 # Set to 0 to disable style.
    interm_style_dims: 256
    final_feat_dim: 64

    # Number of pixels removed from each edge to reduce boundary artifact of CNN
    # both sides combined (8 -> 4 on left and 4 on right).
    pad: 6

    # ======== Sky network ========
    pe_lvl_raydir_sky: 5
    pe_incl_orig_raydir_sky: True

    # ======== Style Encoder =========
    # Comment out to disable style encoder.
    style_enc:
        num_filters: 64
        kernel_size: 3
        weight_norm_type: "none"

    stylenet_model: StyleMLP
    stylenet_model_kwargs:
        normalize_input: True
        num_layers: 5

    mlp_model: RenderMLP
    mlp_model_kwargs:
        use_seg: True

    # ======== Ray Casting Params ========
    num_blocks_early_stop: 6
    num_samples: 24 # Decrease it if you got OOM on lowend GPU
    sample_depth: 3 # Stop the ray after certain depth
    coarse_deterministic_sampling: False
    sample_use_box_boundaries: False # Including voxel boundaries into the sample

    # ======== Blender ========
    raw_noise_std: 0.0
    dists_scale: 0.25
    clip_feat_map: True
    # Prevent sky from leaking to the foreground.
    keep_sky_out: True
    keep_sky_out_avgpool: True
    sky_global_avgpool: True

    # ======== Label translator ========
    reduced_label_set: True

    # ======== Camera sampler ========
    camera_sampler_type: "traditional"
    cam_res: [360, 640] # Camera resolution before cropping.
    crop_size: [128, 128] # Actual crop size is crop_size+pad. It should generally match random_crop_h_w in dataloader.

    # Threshold for rejecting camera poses that will result in a seg mask with low entropy.
    # Generally, 0.5 min, 0.8 max.
    camera_min_entropy: 0.75

    # Threshold for rejecting camera poses that are too close to the objects.
    camera_rej_avg_depth: 2.0

trainer:
    sds:
        pretrained_model_name_or_path: "stabilityai/stable-diffusion-2-1-base"
        guidance_scale: 15
